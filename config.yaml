# Παράμετροι μοντέλου κατατάξεων στρατευσίμων (Ελλάδα)

cohort:
  # Δυνητική κοόρτη έτους t = Σ_k w_k * male_births(t - k)
  # Προεπιλογή: οι ηλικίες 19-26 (νόμιμη ηλικία κατάταξης 19ο έτος,
  # με αναβολές σπουδών που μετακυλίουν μεγάλο μέρος στα 22-24).
  # Τα βάρη αθροίζουν σε 1 και εκφράζουν ΠΟΤΕ κατατάσσεται η μέση κοόρτη,
  # όχι πόσοι κατατάσσονται (αυτό το αναλαμβάνει το alpha).
  weights:
    19: 0.18
    20: 0.14
    21: 0.12
    22: 0.14
    23: 0.16
    24: 0.14
    25: 0.07
    26: 0.05

model:
  # Παράθυρο για το σταθερό alpha της προβολής (τελευταία παρατηρούμενα έτη)
  alpha_window_years: 10
  # Εύρος αβεβαιότητας προβολής: ποσοστημόρια του παρατηρούμενου alpha
  uncertainty:
    low_quantile: 0.10
    high_quantile: 0.90
  projection_end_year: 2040

period:
  start_year: 1974

alpha:
  # Με ΕΝΑ μόνο παρατηρούμενο σημείο κατατάξεων (μ.ό. 2021-2025) το alpha
  # είναι μία σταθερά βαθμονόμησης, όχι χρονοσειρά. Το εύρος παρακάτω είναι
  # ΣΕΝΑΡΙΑΚΟ (κρίση), ΟΧΙ στατιστικό διάστημα εμπιστοσύνης. Βλ. README.
  scenario_low: 0.85
  scenario_high: 1.15
  # Ανώτατο θεωρητικό σενάριο: αν ανακτώνταν ΟΛΕΣ οι ετήσιες απώλειες
  # (16.500 σε 35.000 καταταχθέντες = +47%) - στοιχεία ΥΠΕΘΑ, Δεκ 2025.
  max_recovery_uplift: 0.471

service:
  # Διάρκεια που χρησιμοποιείται για υπηρετούντες/απολύσεις: ΣΞ, πραγματική.
  # Από το 2021 συνυπάρχουν 12μηνο και 9μηνο (ακριτικά) -> σταθμισμένο.
  branch_for_derived: "ΣΞ"
  post2021_effective_months: 11.0
  post2021_effective_note: >
    Παραδοχή: ~2/3 στο 12μηνο και ~1/3 στο 9μηνο (διζωνικό ΦΕΚ Β' 853/2021).
    ΔΕΝ βρέθηκε επίσημη κατανομή - είναι παράμετρος, άλλαξέ τη εδώ.
